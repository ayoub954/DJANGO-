{% extends "base.html" %}

{% block title %}Supprimer {{ entreprise.raison_sociale }}{% endblock %}

{% block content %}
<h2>Supprimer l'entreprise {{ entreprise.raison_sociale }} ?</h2>
<p>Ses véhicules, expéditions et offres seront aussi supprimés.</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn-danger">Confirmer la suppression</button>
    <a href="{% url 'entreprises:detail' entreprise.pk %}">Annuler</a>
</form>
{% endblock %}
