{% extends "base.html" %}

{% block title %}{% if entreprise %}Modifier{% else %}Ajouter{% endif %} une entreprise{% endblock %}

{% block content %}
<h2>{% if entreprise %}Modifier {{ entreprise }}{% else %}Ajouter une entreprise{% endif %}</h2>
<form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Enregistrer</button>
    <a href="{% url 'entreprises:liste' %}">Annuler</a>
</form>
{% endblock %}
