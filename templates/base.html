<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}TransConnect{% endblock %} | TransConnect</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #222; }
        nav { background: #b30000; padding: 12px 24px; display: flex; gap: 20px; flex-wrap: wrap; }
        nav a { color: #fff; text-decoration: none; font-weight: 600; }
        nav a.brand { margin-right: auto; }
        main { max-width: 1000px; margin: 24px auto; padding: 0 16px; }
        table { border-collapse: collapse; width: 100%; background: #fff; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #eee; }
        .messages li { padding: 8px; margin-bottom: 6px; list-style: none; }
        .messages .success { background: #e3f6e3; }
        .messages .error { background: #fde2e2; }
        .btn-danger { background: #b30000; color: #fff; border: 0; padding: 8px 14px; cursor: pointer; }
    </style>
</head>
<body>
    <nav>
        <a class="brand" href="{% url 'expeditions:liste' %}">TransConnect</a>
        <a href="{% url 'expeditions:liste' %}">Expéditions</a>
        <a href="{% url 'vehicules:liste' %}">Véhicules</a>
        <a href="{% url 'offres:liste' %}">Offres</a>
        <a href="{% url 'entreprises:liste' %}">Entreprises</a>
        <a href="{% url 'admin:index' %}">Admin</a>
    </nav>
    <main>
        {% if messages %}
        <ul class="messages">
            {% for message in messages %}
            <li class="{{ message.tags }}">{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
